# Invitation landing page (EN). Draft written by Claude — to be reviewed by the team.
# meta: also the link preview card shown in WhatsApp, iMessage, Messenger… (description ≤ 160 chars).
# ES, for when the es locale is added: title "Invitación para unirte a un proyecto en Cruzmi",
# description "Únete al grupo en Cruzmi, la app gratuita para organizar viajes y proyectos en grupo: programa, gastos compartidos, fotos…"
meta:
  title: "You're invited to join a project on Cruzmi"
  description: "Join the group on Cruzmi, the free app to plan trips and projects together: schedule, shared expenses, photos and more."
  imageAlt: "Cruzmi, the app to plan trips and projects together"

kicker: "Invitation"
title: "You're invited to join a Cruzmi project!"
lead: "Someone close to you has invited you to plan a group project with Cruzmi. All you need to join is the app: it's free and ready in two minutes."

steps:
  - title: "Install Cruzmi"
    text: "Download the app from the App Store or Google Play."
  - title: "Create your account"
    text: "Open Cruzmi and sign up, or log in if you already have an account."
  - title: "Join the project"
    text: "Come back to this page and tap the button below: the invitation will open straight in the app."
    textNoLink: "Tap the invitation link you received again: it will open straight in the app."

openButton: "Open the invitation in Cruzmi"
help: "Link not working? Ask the project organiser to send you a new invitation, or"
helpLink: "write to us"

discover:
  title: "What is Cruzmi?"
  text: "The collaborative app to organise and live your projects together: schedule, route map, shared budget, meals, shopping and photos, in one place for the whole group."
  link: "Discover the features"
